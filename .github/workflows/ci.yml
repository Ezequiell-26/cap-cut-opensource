name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ccos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ startsWith(matrix.os, 'windows') && 'windows' || startsWith(matrix.os, 'macos') && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ startsWith(matrix.os, 'windows') && 'win64_msvc2022_64' || startsWith(matrix.os, 'macos') && 'clang_64' || 'linux_gcc_64' }}
          modules: 'qtmultimedia;qtsvg'
          cache: true

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Install Windows dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Native C++ repository guard
        run: |
          cmake -S tools/ccos_guard -B build-guard -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-guard --config Release --parallel
          ctest --test-dir build-guard -C Release --output-on-failure

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCCOS_BUILD_TESTS=ON -DCCOS_FETCH_GTEST=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
