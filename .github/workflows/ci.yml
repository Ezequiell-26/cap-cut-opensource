name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ startsWith(matrix.os, 'windows') && 'windows' || startsWith(matrix.os, 'macos') && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ startsWith(matrix.os, 'windows') && 'win64_msvc2022_64' || startsWith(matrix.os, 'macos') && 'clang_64' || 'linux_gcc_64' }}
          modules: 'qtmultimedia'
          cache: true

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Install Windows dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCCOS_BUILD_TESTS=ON -DCCOS_FETCH_GTEST=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
