name: Guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ccos-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guard:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native C++ guard
        run: |
          cmake -S tools/ccos_guard -B build-guard -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-guard --parallel
          ctest --test-dir build-guard --output-on-failure
      - name: Diff guard
        run: git diff --check

  asan-ubsan:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia'
          cache: true
      - name: Configure sanitized build
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build-sanitize -G Ninja -DCCOS_BUILD_TESTS=ON -DCCOS_FETCH_GTEST=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure
