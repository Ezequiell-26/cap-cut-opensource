name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
            generator: TGZ
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            generator: NSIS
          - os: macos-14
            host: mac
            arch: clang_64
            generator: DragNDrop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          modules: 'qtmultimedia;qtmultimediawidgets'
          cache: true
          tools: 'tools_ifw_5.15.2'

      - name: Install build tools (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install build tools (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Install build tools (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCCOS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Bundle Qt runtime (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime --multimedia build\ccos_editor.exe

      - name: Bundle Qt runtime (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          macdeployqt build/ccos_editor.app -verbose=1

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G "${{ matrix.generator }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CCOS-${{ matrix.os }}
          path: |
            build/*.exe
            build/*.dmg
            build/*.tar.gz
          if-no-files-found: ignore
