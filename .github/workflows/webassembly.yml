name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  QT_WASM_ARCH: 'wasm_singlethread'
  QT_PREFIX: '${{ github.workspace }}/.qt'
  EMSDK_PATH: '${{ github.workspace }}/.emsdk'
  EM_VERSION: '3.1.56'

concurrency:
  group: ccos-webassembly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build CCOS WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 python3-pip git ca-certificates

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$EMSDK_PATH" ]; then
            git clone --depth 1 --branch "$EM_VERSION" https://github.com/emscripten-core/emsdk.git "$EMSDK_PATH"
          fi
          "$EMSDK_PATH/emsdk" install "$EM_VERSION"
          "$EMSDK_PATH/emsdk" activate "$EM_VERSION"
          source "$EMSDK_PATH/emsdk_env.sh"
          echo "EMSDK=$EMSDK_PATH" >> "$GITHUB_ENV"
          echo "$EMSDK_PATH" >> "$GITHUB_PATH"
          echo "$EMSDK_PATH/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EM_CACHE=$EMSDK_PATH/upstream/emscripten/cache" >> "$GITHUB_ENV"
          emcc --version

      - name: Install Qt for WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'aqtinstall>=3.3,<3.4'
          python3 -m aqt install-qt all_os wasm "$QT_VERSION" "$QT_WASM_ARCH" \
            --autodesktop \
            --modules qtmultimedia \
            --outputdir "$QT_PREFIX"
          echo "QT_ROOT_DIR=$QT_PREFIX/$QT_VERSION/$QT_WASM_ARCH" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$QT_PREFIX/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          echo "$QT_PREFIX/$QT_VERSION/$QT_WASM_ARCH/bin" >> "$GITHUB_PATH"

      - name: Verify Qt/Emscripten toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          test -n "${QT_HOST_PATH:-}"
          test -d "$QT_HOST_PATH"
          source "$EMSDK/emsdk_env.sh"
          emcc --version
          echo "Qt WASM: $QT_ROOT_DIR"
          echo "Qt host: $QT_HOST_PATH"

      - name: Configure WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          cmake --preset web

      - name: Build WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$EMSDK/emsdk_env.sh"
          cmake --build --preset web --parallel 2

      - name: Assemble static web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web-dist
          mkdir -p web-dist

          test -f build/web/ccos-editor.html
          cp build/web/ccos-editor.html web-dist/index.html

          for file in build/web/ccos-editor.js build/web/ccos-editor.wasm build/web/qtloader.js; do
            if [ -f "$file" ]; then
              cp "$file" web-dist/
            fi
          done

          find build/web -maxdepth 1 -type f \
            \( -name 'ccos-editor.*' -o -name '*.worker.js' -o -name 'qtlogo.svg' \) \
            ! -name 'ccos-editor.html' ! -name 'ccos-editor.js' ! -name 'ccos-editor.wasm' \
            -exec cp {} web-dist/ \;

          if [ -f web/vercel.json ]; then
            cp web/vercel.json web-dist/vercel.json
          fi

          printf '\n' > web-dist/.nojekyll
          test -f web-dist/index.html
          test -f web-dist/ccos-editor.wasm

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccos-webassembly-${{ github.sha }}
          path: web-dist
          if-no-files-found: error
          retention-days: 7
