name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.8.3'
  QT_WASM_ARCH: 'wasm_singlethread'
  QT_PREFIX: '${{ github.workspace }}/.qt'
  EM_VERSION: '3.1.56'
  EMSDK_ROOT_DIR: '${{ github.workspace }}/.emsdk'
  AQT_VENV: '${{ github.workspace }}/.aqt-venv'

concurrency:
  group: ccos-webassembly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build CCOS WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 python3-pip python3-venv git ca-certificates clang-tools
          scan_deps="$(find /usr/lib/llvm-* /usr/bin -type f -name clang-scan-deps 2>/dev/null | sort -V | tail -n 1)"
          test -n "$scan_deps"
          sudo ln -sf "$scan_deps" /usr/local/bin/clang-scan-deps
          clang-scan-deps --version

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emsdk_dir="${EMSDK_ROOT_DIR}"
          if [ ! -d "$emsdk_dir" ]; then
            git clone --depth 1 --branch "$EM_VERSION" https://github.com/emscripten-core/emsdk.git "$emsdk_dir"
          fi
          "$emsdk_dir/emsdk" install "$EM_VERSION"
          "$emsdk_dir/emsdk" activate "$EM_VERSION"
          source "$emsdk_dir/emsdk_env.sh"
          echo "CCOS_EMSDK_DIR=$emsdk_dir" >> "$GITHUB_ENV"
          echo "EMSDK=$emsdk_dir" >> "$GITHUB_ENV"
          echo "$emsdk_dir" >> "$GITHUB_PATH"
          echo "$emsdk_dir/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EM_CACHE=$emsdk_dir/upstream/emscripten/cache" >> "$GITHUB_ENV"
          emcc --version

      - name: Install Qt for WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$AQT_VENV"
          "$AQT_VENV/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'aqtinstall==3.3.0'
          "$AQT_VENV/bin/python" -m aqt install-qt all_os wasm "$QT_VERSION" "$QT_WASM_ARCH" \
            --autodesktop \
            --modules qtmultimedia \
            --outputdir "$QT_PREFIX"
          echo "QT_ROOT_DIR=$QT_PREFIX/$QT_VERSION/$QT_WASM_ARCH" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$QT_PREFIX/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
          echo "$QT_PREFIX/$QT_VERSION/$QT_WASM_ARCH/bin" >> "$GITHUB_PATH"

      - name: Verify Qt/Emscripten toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          test -d "$QT_HOST_PATH"
          source "$CCOS_EMSDK_DIR/emsdk_env.sh"
          emcc --version
          clang-scan-deps --version

      - name: Prepare Emscripten WebGL libraries
        shell: bash
        run: |
          set -euo pipefail
          source "$CCOS_EMSDK_DIR/emsdk_env.sh"
          embuilder build libGL
          test -f "$(emcc --print-file-name=libGL.a)"
          test -f "$CCOS_EMSDK_DIR/upstream/emscripten/cache/sysroot/include/EGL/egl.h"

      - name: Configure WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$CCOS_EMSDK_DIR/emsdk_env.sh"
          cmake --preset web

      - name: Build WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          source "$CCOS_EMSDK_DIR/emsdk_env.sh"
          cmake --build --preset web --parallel 2

      - name: Prepare browser FFmpeg runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/ccos-ffmpeg-runtime"
          rm -rf "$runtime" web-dist
          mkdir -p "$runtime/ffmpeg" "$runtime/core" web-dist/vendor/ffmpeg web-dist/vendor/ffmpeg-core
          cd "$runtime"
          npm pack --silent '@ffmpeg/ffmpeg@0.12.15'
          npm pack --silent '@ffmpeg/core@0.12.10'
          mkdir -p ffmpeg/pkg core/pkg
          tar -xzf ffmpeg-0.12.15.tgz -C ffmpeg/pkg --strip-components=1
          tar -xzf core-0.12.10.tgz -C core/pkg --strip-components=1
          cp -R ffmpeg/pkg/dist/esm/. "$GITHUB_WORKSPACE/web-dist/vendor/ffmpeg/"
          cp -R core/pkg/dist/esm/. "$GITHUB_WORKSPACE/web-dist/vendor/ffmpeg-core/"

      - name: Assemble static web bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web-dist
          test -f build/web/ccos-editor.html
          test -f build/web/ccos-editor.js
          test -f build/web/ccos-editor.wasm
          cp build/web/ccos-editor.html web-dist/index.html
          cp build/web/ccos-editor.js web-dist/
          cp build/web/ccos-editor.wasm web-dist/
          if [ -f build/web/qtloader.js ]; then cp build/web/qtloader.js web-dist/; fi
          find build/web -maxdepth 1 -type f \( -name 'ccos-editor.*' -o -name '*.worker.js' -o -name 'qtlogo.svg' \) \
            ! -name 'ccos-editor.html' ! -name 'ccos-editor.js' ! -name 'ccos-editor.wasm' -exec cp {} web-dist/ \;
          cp web/ccos-web-bridge.js web-dist/ccos-web-bridge.js
          if [ -f web/vercel.json ]; then cp web/vercel.json web-dist/vercel.json; fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web-dist/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="./ccos-web-bridge.js"></script>'
          if tag not in text:
              text = text.replace('<head>', '<head>\n' + tag, 1)
          path.write_text(text, encoding='utf-8')
          PY
          printf '%s\n' 'CCOS WebAssembly bundle' > web-dist/.nojekyll
          test -f web-dist/index.html
          test -f web-dist/ccos-editor.wasm
          test -f web-dist/vendor/ffmpeg/index.js
          test -f web-dist/vendor/ffmpeg-core/ffmpeg-core.js
          test -f web-dist/vendor/ffmpeg-core/ffmpeg-core.wasm

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccos-webassembly-${{ github.sha }}
          path: web-dist
          if-no-files-found: error
          retention-days: 7
